kind = "slides"
previewPath = "/conciergo-deck/"
title = "ConcierGo Deck"
version = "1.0.0"
id = "artifacts/conciergo-deck"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/conciergo-deck/" ]
localPort = 22921

[services.development]
run = "pnpm --filter @workspace/conciergo-deck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/conciergo-deck", "run", "build" ]
publicDir = "artifacts/conciergo-deck/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22921"
BASE_PATH = "/conciergo-deck/"
