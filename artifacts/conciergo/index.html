<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>ConcierGo</title>
    <meta name="description" content="ConcierGo — built on Replit. Update this description to reflect the app." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="ConcierGo" />
    <meta property="og:description" content="ConcierGo — built on Replit. Update this description to reflect the app." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ConcierGo" />
    <meta name="twitter:description" content="ConcierGo — built on Replit. Update this description to reflect the app." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://ep-misty-fog-b1g1ht0t.neonauth.c-5.eu-central-1.aws.neon.tech" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html, body, #root {
        margin: 0;
        min-height: 100dvh;
        background: hsl(40 20% 97%);
      }
      .app-boot {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: hsl(40 20% 97%);
      }
      .app-boot-platter {
        position: relative;
        width: 7rem;
        height: 7rem;
        border-radius: 50%;
        border: 3px solid hsl(20 15% 15%);
        background: hsl(20 15% 12%);
      }
      .app-boot-disc {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background:
          radial-gradient(circle at 50% 50%,
            hsl(40 20% 97%) 0 3.5px,
            hsl(20 15% 15%) 3.5px 6px,
            hsl(15 75% 55%) 6px 22px,
            hsl(15 70% 42%) 22px 25px,
            transparent 25.5px),
          conic-gradient(from 0deg,
            transparent 0 8deg,
            hsl(0 0% 100% / 0.38) 26deg,
            transparent 78deg,
            transparent 180deg,
            hsl(0 0% 100% / 0.14) 205deg,
            transparent 250deg),
          repeating-radial-gradient(circle at 50% 50%,
            hsl(20 10% 8%) 0 1.5px,
            hsl(25 8% 18%) 1.5px 3.5px);
        animation: app-boot-spin 0.95s linear infinite;
      }
      .app-boot-disc::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1.6rem;
        height: 0.28rem;
        margin: -0.14rem 0 0 -0.8rem;
        border-radius: 999px;
        background: hsl(40 20% 97% / 0.85);
      }
      @keyframes app-boot-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-boot-disc { animation: none; }
      }
      .events-boot,
      .events-boot * { box-sizing: border-box; }
      .events-boot {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        background: hsl(40 20% 97%);
        color: hsl(20 15% 15%);
        font-family: Fraunces, Georgia, serif;
      }
      .events-boot-sidebar { display: none; }
      .events-boot-main { flex: 1; min-width: 0; }
      .events-boot-mobile-bar {
        display: flex;
        align-items: center;
        height: 4rem;
        padding: 0 1rem;
        border-bottom: 2px solid hsl(20 15% 15%);
        background: #fff;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        text-transform: uppercase;
      }
      .events-boot-inner { max-width: 64rem; margin: 0 auto; padding: 1rem 1rem 8rem; }
      .events-boot-title {
        margin: 0 0 1.25rem;
        font-size: 2.25rem;
        font-weight: 700;
        letter-spacing: -0.04em;
        text-transform: uppercase;
      }
      .events-boot-chips { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 2rem; }
      .events-boot-chip,
      .events-boot-block {
        background: hsl(15 75% 55% / 0.12);
        animation: events-boot-pulse 1.1s ease-in-out infinite;
      }
      .events-boot-chip {
        height: 2rem;
        border: 2px solid hsl(20 15% 15% / 0.15);
        border-radius: 0.5rem;
      }
      .events-boot-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      .events-boot-card {
        background: #fff;
        border: 2px solid hsl(20 15% 15%);
        border-radius: 1rem;
        overflow: hidden;
      }
      .events-boot-art {
        height: 8rem;
        border-bottom: 2px solid hsl(20 15% 15%);
        background: hsl(30 15% 94%);
        position: relative;
      }
      .events-boot-art .events-boot-block { position: absolute; inset: 0; }
      .events-boot-body { padding: 0.85rem 1rem 1.1rem; }
      .events-boot-line { height: 0.85rem; border-radius: 0.25rem; margin-bottom: 0.65rem; }
      @keyframes events-boot-pulse {
        50% { opacity: 0.45; }
      }
      .events-boot-brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 2rem;
        font-size: 1.875rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        text-transform: uppercase;
      }
      .events-boot-mark {
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 0.75rem;
        background: hsl(20 15% 15%);
        transform: rotate(-3deg);
        box-shadow: 4px 4px 0 0 hsl(15 75% 55%);
      }
      .events-boot-nav { padding: 0 1.5rem; display: flex; flex-direction: column; gap: 0.75rem; }
      .events-boot-nav-item {
        height: 3.25rem;
        border: 2px solid transparent;
        border-radius: 0.75rem;
        background: hsl(15 75% 55% / 0.12);
      }
      .events-boot-nav-item-active {
        border-color: hsl(20 15% 15%);
        background: hsl(15 75% 55%);
        box-shadow: 4px 4px 0 0 hsl(20 15% 15%);
      }
      @media (min-width: 768px) {
        .events-boot { flex-direction: row; }
        .events-boot-sidebar {
          display: flex;
          flex-direction: column;
          width: 18rem;
          flex-shrink: 0;
          border-right: 2px solid hsl(20 15% 15%);
          background: #fff;
        }
        .events-boot-mobile-bar { display: none; }
        .events-boot-inner { padding: 2.5rem 2.5rem 3rem; }
        .events-boot-title { font-size: 3rem; }
        .events-boot-grid { grid-template-columns: 1fr 1fr; gap: 2rem; }
        .events-boot-art { height: 12rem; }
      }
      @media (prefers-reduced-motion: reduce) {
        .events-boot-chip,
        .events-boot-block { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-boot" id="app-boot" role="status" aria-live="polite" aria-label="Cargando ConcierGo">
        <div class="app-boot-platter">
          <div class="app-boot-disc" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var path = location.pathname.replace(/\/+$/, "");
        if (path !== "/events") return;
        var boot = document.getElementById("app-boot");
        if (!boot) return;
        var card =
          '<article class="events-boot-card" aria-hidden="true">' +
            '<div class="events-boot-art"><div class="events-boot-block"></div></div>' +
            '<div class="events-boot-body">' +
              '<div class="events-boot-block events-boot-line" style="width:75%"></div>' +
              '<div class="events-boot-block events-boot-line" style="width:45%"></div>' +
              '<div class="events-boot-block events-boot-line" style="width:38%;height:2rem"></div>' +
            "</div>" +
          "</article>";
        boot.className = "events-boot";
        boot.setAttribute("aria-label", "Cargando cartelera");
        boot.innerHTML =
          '<aside class="events-boot-sidebar" aria-hidden="true">' +
            '<div class="events-boot-brand"><span class="events-boot-mark"></span>ConcierGo</div>' +
            '<div class="events-boot-nav">' +
              '<div class="events-boot-nav-item events-boot-nav-item-active"></div>' +
              '<div class="events-boot-nav-item"></div>' +
            "</div>" +
          "</aside>" +
          '<div class="events-boot-main">' +
            '<header class="events-boot-mobile-bar">Eventos</header>' +
            '<div class="events-boot-inner">' +
              "<h1 class=\"events-boot-title\">Cartelera</h1>" +
              '<div class="events-boot-chips">' +
                '<span class="events-boot-chip" style="width:5rem"></span>' +
                '<span class="events-boot-chip" style="width:6rem"></span>' +
                '<span class="events-boot-chip" style="width:4rem"></span>' +
              "</div>" +
              '<div class="events-boot-grid">' + card + card + card + card + card + card + "</div>" +
            "</div>" +
          "</div>";
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
