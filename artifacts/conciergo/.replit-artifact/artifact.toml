kind = "web"
previewPath = "/"
title = "ConcierGo"
version = "1.0.0"
id = "artifacts/conciergo"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18427

[services.development]
run = "pnpm --filter @workspace/conciergo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/conciergo", "run", "build" ]
publicDir = "artifacts/conciergo/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18427"
BASE_PATH = "/"
